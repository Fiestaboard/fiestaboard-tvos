name: App Store release

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, upload without submitting, or upload and submit to Apple
        type: choice
        options: [plan, upload, submit]
        default: plan

permissions:
  contents: read
  actions: read

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || vars.APP_STORE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Plan release from an exactly tested main commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: "6826639070"
        run: |
          set -euo pipefail
          umask 077
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          python3 -c 'import os; from pathlib import Path; Path(os.environ["ASC_KEY_PATH"]).write_text(os.environ["ASC_KEY_P8"])'
          python3 scripts/app-store-release.py --output build/release-plan.json
          cat build/release-plan.json >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true' && (github.event_name == 'schedule' || inputs.mode != 'plan')
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      SUBMIT_FOR_REVIEW: ${{ github.event_name == 'schedule' || inputs.mode == 'submit' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3"
      - name: Install release tooling
        run: gem install fastlane --version 2.241.1 --no-document
      - uses: ./.github/actions/setup-tvos
      - name: Install isolated distribution signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APP_PROFILE_BASE64: ${{ secrets.APPLE_APP_PROFILE_BASE64 }}
          APPLE_TOPSHELF_PROFILE_BASE64: ${{ secrets.APPLE_TOPSHELF_PROFILE_BASE64 }}
        run: bash scripts/install-app-store-signing.sh
      - name: Archive and export public App Store build
        run: |
          set -euo pipefail
          xcodebuild -project FiestaBoardTV.xcodeproj -scheme FiestaBoardTV \
            -configuration Release -destination 'generic/platform=tvOS' \
            -archivePath build/FiestaBoardTV.xcarchive \
            MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER" archive
          xcodebuild -exportArchive -archivePath build/FiestaBoardTV.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/app-store-signing/ExportOptions.plist" \
            -exportPath build/app-store
      - name: Upload and optionally submit to Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/app-store-signing/AuthKey.p8
        run: |
          set -euo pipefail
          export RELEASE_IPA="$PWD/build/app-store/FiestaBoardTV.ipa"
          fastlane tvos release
      - name: Verify Apple processed a public-eligible build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/app-store-signing/AuthKey.p8
          ASC_APP_ID: "6826639070"
        run: python3 scripts/app-store-release.py --wait-for-build "$RELEASE_BUILD_NUMBER" --version "$RELEASE_VERSION"
      - name: Record successful upload provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/app-store-builds/v$RELEASE_VERSION/$RELEASE_BUILD_NUMBER" \
            -f "sha=$RELEASE_SHA"
          {
            echo "Uploaded version $RELEASE_VERSION ($RELEASE_BUILD_NUMBER) from $RELEASE_SHA."
            echo "Submitted for public review: $SUBMIT_FOR_REVIEW."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-store-signing/release.keychain-db" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/app-store-signing/installed-profiles.txt" ]; then
            while IFS= read -r profile; do rm -f "$profile"; done < "$RUNNER_TEMP/app-store-signing/installed-profiles.txt"
          fi
          rm -rf "$RUNNER_TEMP/app-store-signing"
