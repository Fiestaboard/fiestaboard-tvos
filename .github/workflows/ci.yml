name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      home_ui:
        description: Also run the informational Home Top Shelf screenshot test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  # Keep this check name stable for branch protection. All app tests and
  # normal remote-navigation UI tests run here; only Home is separate.
  build-and-test:
    runs-on: macos-26
    # 17 min before A0; the Figma parity shots and the SwiftPM resolve for
    # swift-snapshot-testing add a little (PHASE-4-TV-PLAN §2.1 allows ~30).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tvos

      - name: Repository guards
        run: |
          ./scripts/check-layering.sh
          ./scripts/check-brand-assets.swift
          ./scripts/test-simulator-selection.sh
          ./scripts/test-release-probe-check.sh
          python3 scripts/test-app-store-release.py
          ruby scripts/test-fastlane-release.rb

      # A4a insets (the user-complete rule): the guard's own tests and the
      # scan of Sources/UI. Also runs in Release archive.
      - name: Inset guard
        run: |
          node --test scripts/insets/tests/*.test.mjs
          node scripts/insets/check-insets.mjs

      # A2 hub vocabulary (the user-complete rule): the guard's own tests and
      # the scan of Sources/ and project.yml. Also runs in Release archive.
      - name: Hub vocabulary guard
        run: |
          node --test scripts/vocabulary/tests/*.test.mjs
          node scripts/vocabulary/check-vocabulary.mjs

      # A1 token bridge: the generator's pins and tests, including the drift
      # check (`--check` fails when the generated Swift no longer matches
      # Tokens/fiestaui-tokens.json and Tokens/platform-tv.json).
      - name: Token bridge drift check
        run: |
          node scripts/tokens/generate-swift.mjs --check
          node --test scripts/tokens/tests/*.test.mjs

      - name: Parity comparer tests
        run: |
          npm ci --prefix scripts/parity --no-audit --no-fund
          npm test --prefix scripts/parity

      - name: Resolve and boot a tvOS simulator
        id: sim
        timeout-minutes: 3
        run: |
          ID=$(xcrun simctl list devices available | ./scripts/select-tvos-simulator.sh)
          if [ -z "$ID" ]; then echo "No Apple TV simulator on this runner." >&2; exit 1; fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$ID" -b
          # Goldens are split only by OS major; record the exact runtime the
          # parity shots ran on (also written as build/parity/runtime.json).
          mkdir -p build/parity
          xcrun simctl list devices "$ID" > build/parity/simctl-device.txt
          xcrun simctl list runtimes tvOS > build/parity/simctl-runtimes.txt

      - name: Build for testing
        id: test-build
        run: |
          xcodebuild -project FiestaBoardTV.xcodeproj \
            -scheme FiestaBoardTV \
            -destination "platform=tvOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            build-for-testing

      - name: OLED care regression
        run: |
          xcodebuild -project FiestaBoardTV.xcodeproj \
            -scheme FiestaBoardTV \
            -destination "platform=tvOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -resultBundlePath build/oled.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:FiestaBoardTVTests/OLEDCareTests \
            -only-testing:FiestaBoardTVTests/OLEDCareIntegrationTests \
            -only-testing:FiestaBoardTVUITests/OLEDCareUITests \
            test-without-building

      - name: Upload OLED care results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oled-xcresult
          path: build/oled.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Matrix transition regression
        run: |
          xcodebuild -project FiestaBoardTV.xcodeproj \
            -scheme FiestaBoardTV \
            -destination "platform=tvOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -resultBundlePath build/matrix.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:FiestaBoardTVTests/MatrixTransitionTests \
            -test-iterations 3 \
            test-without-building

      - name: Upload matrix results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-xcresult
          path: build/matrix.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # Publish navigation evidence before the longer Settings UI suite.
      # A failed Panels step still fails this required job; the remaining
      # suite runs too so one failure does not hide unrelated regressions.
      - name: Panels navigation tests
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: |
          xcodebuild -project FiestaBoardTV.xcodeproj \
            -scheme FiestaBoardTV \
            -destination "platform=tvOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -resultBundlePath build/panels.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:FiestaBoardTVUITests/PanelsPresentationTests \
            test-without-building

      - name: Collect panel timing evidence
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: |
          CONTAINER=$(xcrun simctl get_app_container "${{ steps.sim.outputs.id }}" com.fiestaboard.tv data)
          cp -R "$CONTAINER/Library/Caches/PanelNavigation" build/panel-navigation

      - name: Upload panel timing evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-navigation-timing
          path: build/panel-navigation
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Panels results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panels-xcresult
          path: build/panels.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Remaining app and UI tests
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        env:
          # swift-snapshot-testing writes failed comparisons here (xcodebuild
          # passes TEST_RUNNER_* through to the test process).
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/build/snapshot-artifacts
        run: |
          xcodebuild -project FiestaBoardTV.xcodeproj \
            -scheme FiestaBoardTV \
            -destination "platform=tvOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -resultBundlePath build/tests.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -skip-testing:FiestaBoardTVUITests/HomeTopShelfUITests \
            -skip-testing:FiestaBoardTVUITests/PanelsPresentationTests \
            -skip-testing:FiestaBoardTVUITests/OLEDCareUITests \
            -skip-testing:FiestaBoardTVTests/OLEDCareTests \
            -skip-testing:FiestaBoardTVTests/OLEDCareIntegrationTests \
            test-without-building

      # XCTest failure details/screenshots remain in xcresult even when the
      # verbose simulator diagnostics collector is off (it can stall 600s).
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-xcresult
          path: build/tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # Report-only Figma parity (PHASE-4-TV-PLAN §2.1, D7). The snapshot
      # tests write shots and FigmaGeometryRegistry probes to build/parity.
      # No --refs here until fiestaboard-design-refs exists (O4): the report
      # lists what was captured, and a local run adds `--refs <dir>`. Findings
      # never fail the job; only bad input (exit 2) does.
      - name: Figma parity report (report-only)
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        run: node scripts/parity/native-parity.mjs --shots build/parity --out build/parity/report >> "$GITHUB_STEP_SUMMARY"

      # Shots, probes, the report, failed snapshot comparisons, and any golden
      # recorded on this runner's OS major (Tests/__Snapshots__/tvOS<major>).
      - name: Upload parity report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: |
            build/parity
            build/snapshot-artifacts
            Tests/__Snapshots__
          if-no-files-found: ignore
          retention-days: 14

  # Independent of simulator tests: a UI failure must not hide a broken
  # Release build or prevent checking the app + embedded extension archive.
  archive:
    name: Release archive
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tvos
      - name: Archive (unsigned)
        run: |
          xcodebuild -project FiestaBoardTV.xcodeproj \
            -scheme FiestaBoardTV \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -derivedDataPath build \
            archive -archivePath build/FiestaBoardTV.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          python3 scripts/check-app-store-plists.py \
            build/FiestaBoardTV.xcarchive/Products/Applications/*.app/Info.plist \
            build/FiestaBoardTV.xcarchive/Products/Applications/*.app/PlugIns/*.appex/Info.plist

      # The DEBUG Figma parity probes (figmaNode, FigmaGeometryRegistry, the
      # parity fixture) must be compiled out of what ships.
      # The user-complete rule (PHASE-4-TV-PLAN §2.0, S4): every screen
      # inset by the safe area or PlatformTV, never by hand.
      - name: Insets in Release
        run: node scripts/insets/check-insets.mjs

      # The user-complete rule (PHASE-4-TV-PLAN §2.0, S4): no hub-sense
      # "board" in what ships.
      - name: Hub vocabulary in Release
        run: node scripts/vocabulary/check-vocabulary.mjs

      - name: No parity probes in Release
        run: ./scripts/check-release-probes.sh build/FiestaBoardTV.xcarchive

      # Preserve executable permissions for local distribution signing/export.
      - name: Package Release archive
        run: tar -czf build/FiestaBoardTV.xcarchive.tar.gz -C build FiestaBoardTV.xcarchive

      - name: Upload Release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-xcarchive
          path: build/FiestaBoardTV.xcarchive.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Home's icon placement/focus makes this informational, so it never
  # blocks (continue-on-error). A7 made it meaningful: it drives the real
  # Top Shelf carousel (07b A9), opens a panel with Play and Panels with
  # More Info, and attaches the XCUIScreen shots — so it now runs on PRs
  # too, where the carousel is reviewed.
  ui-tests:
    name: Home Top Shelf screenshot (informational, not required)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.home_ui)
    continue-on-error: true
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tvos
      - name: Resolve and boot a tvOS simulator
        id: sim
        timeout-minutes: 3
        run: |
          ID=$(xcrun simctl list devices available | ./scripts/select-tvos-simulator.sh)
          if [ -z "$ID" ]; then echo "No Apple TV simulator on this runner." >&2; exit 1; fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$ID" -b

      - name: Home UI test
        run: |
          xcodebuild -project FiestaBoardTV.xcodeproj \
            -scheme FiestaBoardTV \
            -destination "platform=tvOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -resultBundlePath build/home-ui.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:FiestaBoardTVUITests/HomeTopShelfUITests \
            test

      - name: Upload Home screenshots and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-ui-xcresult
          path: build/home-ui.xcresult
          if-no-files-found: ignore
          retention-days: 7
