name: FiestaBoardTV
options:
  bundleIdPrefix: com.fiestaboard
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  FiestaBoardTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Core
      - path: Sources/Render
      - path: Sources/UI
      - path: Spec
        type: folder
      - path: Resources
        excludes:
          - Matrix/LICENSE
          - TacoLoader
      - path: Resources/TacoLoader
        type: folder
      - path: Resources/Matrix/LICENSE
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        # "FiestaBoard for Apple TV" is the App Store *listing* name. The
        # bundle name is what sits under the Home-screen icon, where 24
        # characters truncate, and Apple's guidelines keep their word mark out
        # of a product name.
        CFBundleDisplayName: FiestaBoard
        # Both targets set GENERATE_INFOPLIST_FILE: NO, and XcodeGen fills the
        # version keys with hard-coded 1.0/1 unless they are named here — so
        # bumping MARKETING_VERSION above would ship nothing and the second
        # upload would come back ITMS-90062. Xcode expands $(...) during
        # plist processing regardless of GENERATE_INFOPLIST_FILE.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The only cryptography is Apple's own: CryptoKit SHA-256 for cache
        # filenames and the Keychain. Both are exempt; without this key every
        # build sits in App Store Connect flagged "Missing Compliance".
        ITSAppUsesNonExemptEncryption: false
        # Both of these keys are inert on tvOS as it stands. tvOS is the one
        # platform that does not implement local network privacy: nothing ever
        # presents this string, and there is no Settings › Privacy › Local
        # Network toggle behind it. Apple's TN3179 platform table lists tvOS
        # "no" (revised 2026-02-17, so it covers this SDK), and the Apple TV
        # Privacy & Security screen has no such row. They stay anyway — Apple's
        # own reference pages mark both keys tvOS 14.0+, and the day tvOS
        # adopts what iOS 14 and macOS 15 already have, an app with no purpose
        # string and no declared browse type is a Connect screen that finds
        # nothing. Do not read them as load-bearing today; see the
        # local-network entry in docs/HANDOFF.md.
        #
        # Kept to one sentence for that day, because it would appear in a
        # system alert, not a document. It used to say only that the app
        # "finds your board", which reads as discovery-only next to a sign-in
        # that POSTs a password to that board. This string is one of four
        # coupled privacy artifacts — see the privacy section of
        # docs/PUBLISHING.md before editing it.
        NSLocalNetworkUsageDescription: FiestaBoard connects to the board you choose to sign in with a password or device credential, display panels, and send requests. FiestaBot requests also reach the AI provider configured on that board.
        NSBonjourServices: ["_http._tcp"]
        UIAppFonts: [SplineSansMono.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: com.fiestaboard.tv.panel
            CFBundleURLSchemes: [fiestaboard]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.tv
        PRODUCT_MODULE_NAME: FiestaBoardTV
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_ENTITLEMENTS: Config/AppGroup.entitlements
    dependencies:
      - target: FiestaBoardTopShelf
        embed: true

  FiestaBoardTopShelf:
    type: app-extension
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: TopShelf/ContentProvider.swift
      - path: Sources/UI/TopShelfContent.swift
      - path: Sources/Core/TopShelfSnapshotStore.swift
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: FiestaBoard Previews
        # An extension whose version disagrees with its host app is an upload
        # rejection, and XcodeGen's default here is a hard-coded 1.0/1 that no
        # version bump ever reaches.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ContentProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.tv.topshelf
        CODE_SIGN_ENTITLEMENTS: Config/AppGroup.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES

  FiestaBoardTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
      - path: Spec
        type: folder
    dependencies:
      - target: FiestaBoardTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  FiestaBoardTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
      - path: Tests/Support/Fixtures.swift
    dependencies:
      - target: FiestaBoardTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AnimationReview:
    build:
      targets:
        FiestaBoardTV: all
        FiestaBoardTVUITests: [test]
    test:
      testPlans:
        - path: AnimationReview.xctestplan
          defaultPlan: true
  FiestaBoardTV:
    build:
      targets:
        FiestaBoardTV: all
        FiestaBoardTVTests: [test]
    test:
      targets: [FiestaBoardTVTests, FiestaBoardTVUITests]
      gatherCoverageData: true
    run:
      config: Debug
